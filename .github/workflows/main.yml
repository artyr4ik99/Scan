name: Build EXE

# Собирает NetSuite.exe (просмотр камер + сканер сети, GUI) и NetScan.exe
# (консольный сканер) через PyInstaller.
#
# Запуск:
#   - вручную: вкладка Actions -> Build EXE -> Run workflow
#   - автоматически: при пуше тега вида v1.0.0 (тогда ещё создаётся
#     GitHub Release с готовыми .exe в качестве вложений)

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write   # нужно, чтобы шаг создания Release мог запушить файлы

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build NetSuite.exe (GUI - камеры + сканер сети)
        run: >
          pyinstaller --noconfirm --onefile --windowed --name NetSuite
          netsuite.py

      - name: Build NetScan.exe (консольный сканер)
        run: pyinstaller --noconfirm --onefile --console --name NetScan netscan.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist/NetSuite.exe
            dist/NetScan.exe
          if-no-files-found: error

      - name: Create GitHub Release (только для тегов v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NetSuite.exe
            dist/NetScan.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
